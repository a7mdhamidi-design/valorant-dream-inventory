name: Update skins

on:
  schedule:
    - cron: "17 3 * * *"     # every day at 03:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python update_site.py
      - name: Save changes
        run: |
          git config user.name "skins-bot"
          git config user.email "skins-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update skins" && git push)
